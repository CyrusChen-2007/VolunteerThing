<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 位置标记 · 人体 / 牙科</title><style>:root{--font-size-base:15px;--foreground:#292329;--background:#f8f6f3}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:15px/1.5 system-ui,sans-serif;padding:24px}main{max-width:1100px;margin:auto}.viz-row,.viz-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.viz-controls>.form-label{flex:1;min-width:180px}.form-label{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.form-range{width:100%;accent-color:#a14d51}.text-small{font-size:12px}.text-muted{color:#736b71}.btn,.form-select{font:inherit;border:1px solid #d9d0d1;border-radius:9px;padding:9px 14px;background:transparent;color:inherit}.btn{cursor:pointer}.btn-primary{background:#48363d;color:#fff;border-color:#48363d}.form-check{display:flex;gap:8px}.form-check-input{accent-color:#a14d51}a{color:#85474c}p{margin:0}details p{margin:12px 0}output{margin-left:auto}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c68b70;outline-offset:3px}@media(max-width:500px){body{padding:14px}}button[aria-pressed="true"]{background:#48363d;color:#fff;border-color:#48363d}
[hidden]{display:none!important}
.model-tabs{display:flex;gap:6px;margin-bottom:20px;padding:5px;width:fit-content;background:#eee8e8;border:1px solid #e1d8da;border-radius:12px}
.model-tabs .btn{border:0;min-height:44px;min-width:112px}
.model-tabs [aria-selected="true"]{background:#48363d;color:white;box-shadow:0 2px 6px #48363d14}
#dental-model{display:block;width:100%;height:clamp(660px,calc(100svh - 130px),960px);border:1px solid #d7dfe2;border-radius:14px;background:#e8edf0}
@media(max-width:500px){.model-tabs{margin-bottom:14px}#dental-model{height:760px}}
</style></head><body><main>
<nav class="model-tabs" role="tablist" aria-label="3D 模型类型">
<button class="btn" id="body-tab" role="tab" aria-selected="true" aria-controls="body-panel" tabindex="0" data-model-tab="body">人体模型</button>
<button class="btn" id="dental-tab" role="tab" aria-selected="false" aria-controls="dental-panel" tabindex="-1" data-model-tab="dental">牙科模型</button>
</nav>
<section id="body-panel" role="tabpanel" aria-labelledby="body-tab">
<div id="skin-paint">
 <div class="viz-row"><span>身体标记</span><span class="text-small text-muted">360° 人体 · 三维表面涂色</span></div>
 <div class="viz-row" role="group" aria-label="操作模式">
  <button class="btn" data-mode="paint" aria-pressed="true">涂色</button><button class="btn" data-mode="rotate" aria-pressed="false">自由旋转</button><button class="btn" data-mode="erase" aria-pressed="false">橡皮擦</button><button class="btn" id="sp-undo">撤销</button><button class="btn" id="sp-clear">清空涂色</button>
 </div>
 <div id="sp-stage" role="img" aria-label="带皮肤的可旋转三维人体。在涂色模式下拖动身体进行标记；使用下方滑杆抬臂。"></div>
 <div class="viz-row"><button class="btn" id="sp-front">正面</button><button class="btn" id="sp-back">背面</button><button class="btn" id="sp-leftview">侧面</button><button class="btn" id="sp-top">俯视</button><button class="btn" id="sp-bottom">仰视</button><span class="text-small text-muted" id="sp-hint">在皮肤上拖动涂色 · 滚轮缩放</span></div>
 <div class="viz-controls">
  <label class="form-label">颜色 <select class="form-select" id="sp-color"><option value="0">珊瑚红</option><option value="1">蓝色</option><option value="2">紫色</option></select></label>
  <label class="form-label">画笔 <input class="form-range" id="sp-size" aria-label="画笔大小" type="range" min="1" max="8" value="3"></label>
 </div>
 <div class="viz-controls">
  <label class="form-label">左臂 <output id="sp-lv">0°</output><input class="form-range" id="sp-left" aria-label="左臂抬起角度" type="range" min="0" max="120" value="0"></label>
  <label class="form-label">右臂 <output id="sp-rv">0°</output><input class="form-range" id="sp-right" aria-label="右臂抬起角度" type="range" min="0" max="120" value="0"></label>
 </div>
 <p id="sp-status" class="text-small" aria-live="polite">正在加载皮肤模型…</p>
</div>
<style>
#skin-paint{display:grid;gap:calc(var(--font-size-base)*.75)}
#skin-paint #sp-stage{height:570px;touch-action:none;cursor:crosshair}
#skin-paint canvas{display:block;width:100%;height:100%}
@media(max-width:440px){#skin-paint #sp-stage{height:420px}}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module" src="./app.js?v=zoom-5x"></script><p style="font-size:12px;margin-top:20px;color:#736b71">模型：<a href="https://www.innerscene.com/tools/library/3d-parts/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1" target="_blank" rel="noreferrer">MakeHuman / Innerscene</a> · CC0 · 姿势仅作示意</p></section>
<section id="dental-panel" role="tabpanel" aria-labelledby="dental-tab" hidden>
<iframe id="dental-model" data-src="../dental-model/index.html" title="牙科 3D 模型：选择牙齿或牙齿及对应牙龈"></iframe>
</section>
<script type="module" src="./model-switcher.js"></script>
</main></body></html>
